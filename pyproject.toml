[project]
name = "checkformeleh"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
    "chromadb>=0.4",
    "python-dotenv>=1.0",
    "streamlit>=1.38",
    "pypdf>=6.14.2",
    "torch>=2.0",
    "lehcore",
]

[dependency-groups]
dev = [
    "pre-commit>=3.8",
    "ruff>=0.6",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# CPU-only torch: this app only ever runs local embeddings/reranking on
# CPU, never GPU, but the default PyPI torch wheel bundles CUDA and is
# several times larger, easily enough to blow past Streamlit Community
# Cloud's 1 GB free-tier memory limit for something never used.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'darwin'" },
]
# Git dependency, not a local path: a Streamlit Community Cloud deploy only
# clones this repo, not sibling directories.
lehcore = { git = "https://github.com/fangting89/lehcore" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
