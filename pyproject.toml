[project]
name = "ask-leh"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
    "chromadb>=0.4",
    "python-dotenv>=1.0",
    "streamlit>=1.38",
    "pypdf>=6.14.2",
]

[dependency-groups]
dev = [
    "pre-commit>=3.8",
    "ruff>=0.6",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
